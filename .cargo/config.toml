# DYLD_FALLBACK_LIBRARY_PATH = "/opt/homebrew/opt/opencv/lib:/opt/homebrew/opt/llvm/lib"
# PKG_CONFIG_PATH = "/opt/homebrew/opt/opencv/lib/pkgconfig"

# ========== Linux (Arch/CachyOS) 配置 ==========
